<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PsiOn</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:sans-serif;background:#f5f5ff;display:flex;align-items:center;justify-content:center;min-height:100vh}
.box{background:white;border-radius:20px;padding:40px;width:360px;box-shadow:0 4px 24px rgba(83,74,183,0.15);text-align:center}
h1{color:#534AB7;font-size:28px;margin-bottom:6px}
p{color:#888;margin-bottom:24px;font-size:14px}
input{width:100%;padding:14px;border:2px solid #e5e7eb;border-radius:12px;font-size:16px;margin-bottom:12px;display:block}
input:focus{outline:none;border-color:#534AB7}
button{width:100%;padding:14px;border:none;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer;margin-bottom:10px}
.btn-main{background:#534AB7;color:white}
.btn-demo{background:white;color:#534AB7;border:2px solid #534AB7}
#app{display:none;text-align:center}
#app h2{color:#534AB7;font-size:24px;margin-bottom:12px}
#app p{color:#444;margin-bottom:20px}
.nav{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:16px}
.nav button{width:auto;padding:10px 16px;font-size:13px;background:#EEEDFE;color:#534AB7;border:none;border-radius:10px}
</style>
</head>
<body>
<div class="box">
  <div id="login-view">
    <h1>PsiOn</h1>
    <p>Prontuário Inteligente</p>
    <input type="email" id="email" placeholder="E-mail" value="">
    <input type="password" id="senha" placeholder="Senha">
    <button class="btn-main" onclick="entrar()">Entrar no PsiOn</button>
    <button class="btn-demo" onclick="demo()">Acessar demonstração</button>
  </div>
  <div id="app">
    <h2>✅ Funcionou!</h2>
    <p id="app-nome">Bem-vinda ao PsiOn!</p>
    <p style="color:#888;font-size:13px">App funcionando corretamente.</p>
    <div class="nav">
      <button onclick="pg('Pacientes')">👤 Pacientes</button>
      <button onclick="pg('Sessão')">🎙️ Sessão</button>
      <button onclick="pg('Documentos')">📄 Docs</button>
      <button onclick="pg('Agenda')">📅 Agenda</button>
      <button onclick="pg('Financeiro')">💰 Financeiro</button>
    </div>
    <br>
    <button class="btn-demo" onclick="sair()" style="width:auto;padding:10px 20px">⎋ Sair</button>
  </div>
</div>
<script>
function entrar(){
  var email=document.getElementById('email').value.trim();
  var senha=document.getElementById('senha').value;
  if(!email||!senha){alert('Preencha e-mail e senha');return;}
  mostrarApp(email.split('@')[0]);
}
function demo(){
  mostrarApp('Dra. Demo');
}
function mostrarApp(nome){
  document.getElementById('login-view').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('app-nome').textContent='Bem-vinda, '+nome+'!';
}
function pg(nome){alert('Abrindo: '+nome);}
function sair(){
  document.getElementById('login-view').style.display='block';
  document.getElementById('app').style.display='none';
}
</script>
</body>
</html>
